<!doctype html> <!-- Use modern HTML. -->
<html lang="en"> <!-- Set the page language. -->
<head> <!-- Start browser settings. -->
  <meta charset="UTF-8"> <!-- Display text and symbols correctly. -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Fit phone and desktop screens. -->
  <title>CosyNest Furniture</title> <!-- Set the browser tab title. -->
  <link rel="stylesheet" href="style.css"> <!-- Load the page design. -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script> <!-- Load React from the CDN. -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> <!-- Load React's page renderer. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> <!-- Convert beginner JSX into browser JavaScript. -->
  <script> /* Configure JSX to use React already loaded above. */
    Babel.registerPreset("react-classic", () => ({ plugins: [[Babel.availablePlugins["transform-react-jsx"], { runtime: "classic" }]] })); /* Keep JSX beginner-friendly without extra packages. */
  </script> <!-- Finish the Babel setup. -->
  <script type="text/babel" data-presets="react-classic" src="script.js"></script> <!-- Run the React JSX app. -->
</head> <!-- End browser settings. -->
<body> <!-- Start the page content. -->
  <div id="root"></div> <!-- React draws the whole website inside this element. -->
</body> <!-- End the page content. -->
</html> <!-- End the HTML page. -->
